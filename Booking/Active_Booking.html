<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCO หม่าล่าทั่ง - คิวปัจจุบัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                }
            }
        }
    </script>
</head>

<body class="bg-white text-gray-800 font-sans">

    <nav class="border-b border-gray-200 py-4 px-6 flex justify-between items-center bg-white sticky top-0 z-50">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='Booking.html'">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-100 shadow-sm flex-shrink-0">
                <img src="../Logo-COCO/COCO Mala.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="font-bold text-lg tracking-wide">COCO หม่าล่าทั่ง</span>
        </div>
        <ul class="hidden md:flex gap-8 text-sm font-medium text-gray-600">
            <li class="cursor-pointer hover:text-black" onclick="window.location.href='Main_Booking.html'">หน้าหลัก</li>
            <li class="cursor-pointer text-black font-bold border-b-2 border-red-500"
                onclick="window.location.href='My_Booking.html'">คิวของฉัน</li>
        </ul>
    </nav>

    <main class="max-w-5xl mx-auto mt-16 px-4">
        <h1 class="text-3xl font-bold text-center mb-12">การจองคิวของฉัน</h1>

        <div id="active-booking-container" class="space-y-6">
        </div>

        <div id="no-booking-msg" class="hidden flex flex-col items-center justify-center mt-20 text-gray-400">
            <p class="text-xl mb-4">ไม่มีรายการจองคิวในขณะนี้</p>
            <button onclick="window.location.href='Booking.html'"
                class="text-[#EE3F3E] underline hover:text-red-700">จองคิวเลย</button>
        </div>
    </main>
</body>

<script>
    // เมื่อโหลดหน้าเสร็จ:
    // 1. ตรวจและยกเลิก booking ที่เลยเวลาก่อน
    // 2. แล้วค่อยแสดงผล
    document.addEventListener('DOMContentLoaded', () => {
        autoExpireBookings();
        renderActiveBookings();
    });

    // ดึง booking ทั้งหมดจาก localStorage
    function getLocalBookings() {
        const stored = localStorage.getItem('coco_bookings');
        return stored ? JSON.parse(stored) : [];
    }

    // จัดรูปแบบเบอร์โทร
    function maskPhoneNumber(phone) {
        if (!phone || phone.length < 10) return phone;
        return phone.substring(0, 3) + '-' + phone.substring(3, 10);
    }

    function renderActiveBookings() {
        const bookings = getLocalBookings();
        const container = document.getElementById('active-booking-container');
        const noMsg = document.getElementById('no-booking-msg');

        container.innerHTML = '';

        // กรองเฉพาะคิวที่ยังดำเนินการอยู่
        // active = รอยืนยัน, processing = Admin อนุมัติแล้ว, !status = ข้อมูลเก่าที่ไม่มี field นี้
        const activeBookings = bookings.filter(b => b.status === 'active' || b.status === 'processing' || !b.status);

        if (activeBookings.length === 0) {
            noMsg.classList.remove('hidden');
            return;
        } else {
            noMsg.classList.add('hidden');
        }

        // .slice().reverse() = copy array แล้วกลับด้าน (ล่าสุดขึ้นก่อน)
        activeBookings.slice().reverse().forEach((booking) => {
            // หา index จริงใน bookings (array หลัก) เพื่อใช้ใน cancelBooking()
            // ใช้ indexOf เพราะ array ถูก reverse แล้ว index จึงไม่ตรงกับตำแหน่งจริง
            const realIndex = bookings.indexOf(booking);

            const displayDate = booking.date ? booking.date : new Date().toLocaleDateString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit' });

            const card = document.createElement('div');
            card.className = 'w-full bg-[#FFF0F0] rounded-2xl p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shadow-sm';

            // แยก UI ตามสถานะ:
            // processing (Admin อนุมัติแล้ว) → การ์ดสีเหลือง ปุ่มยกเลิกถูกซ่อน
            // active (รอยืนยัน) → การ์ดสีชมพู มีปุ่มยกเลิก
            const isProcessing = booking.status === 'processing';
            card.className = `w-full ${isProcessing ? 'bg-[#FFF8E1]' : 'bg-[#FFF0F0]'} rounded-2xl p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shadow-sm`;

            card.innerHTML = `
                    <div class="space-y-1 text-gray-800 font-medium text-lg w-full md:w-auto">
                        <p>ชื่อผู้จอง : <span class="font-normal text-gray-600">${booking.name}</span></p>
                        <p>เบอร์ : <span class="font-normal text-gray-600">${maskPhoneNumber(booking.phone)}</span></p>
                        <p>รหัสคิว : <span class="text-[#EE3F3E] font-bold">${booking.queue}</span></p>
                        <p>ลำดับโต๊ะ : <span class="font-normal text-gray-600">${booking.table}</span></p>
                        <p>เวลา : <span class="font-normal text-gray-600">${booking.time}</span></p>
                    </div>

                    <div class="flex flex-row md:flex-row items-center justify-between w-full md:w-auto gap-8 md:gap-12 mt-4 md:mt-0">
                        <span class="text-gray-800 font-medium text-lg">${displayDate}</span>
                        ${isProcessing
                            ? `<div class="flex items-center gap-2 px-6 py-3 bg-[#28a745] text-white text-base font-bold rounded-lg shadow-md whitespace-nowrap">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                ยืนยันตัวตนแล้ว
                               </div>`
                            : `<button onclick="cancelBooking(${realIndex})"
                                class="px-6 py-3 bg-[#EE3F3E] text-white text-base font-bold rounded-lg hover:bg-red-700 transition shadow-md whitespace-nowrap">
                                ยกเลิกการจอง
                               </button>`
                        }
                    </div>
                `;
            container.appendChild(card);
        });
    }

    // ยกเลิกการจอง — ไม่ลบข้อมูลออกจาก array
    // แต่เปลี่ยน status เป็น 'cancelled' แทน เพื่อให้ยังแสดงในหน้าประวัติได้
    function cancelBooking(index) {
        if (confirm('คุณต้องการยกเลิกการจองคิวนี้ใช่หรือไม่?')) {
            const bookings = getLocalBookings();
            if (bookings[index]) {
                bookings[index].status = 'cancelled'; // เปลี่ยน status แทนการลบ
                localStorage.setItem('coco_bookings', JSON.stringify(bookings));
                renderActiveBookings(); // re-render หน้าใหม่
            }
        }
    }

    // ── ยกเลิกอัตโนมัติ: active ที่เลยเวลานัด 5 นาทีแล้ว ──
    // ยกเลิกอัตโนมัติ: active booking ที่เลยเวลานัด + 5 นาทีแล้ว
    // ทำงานทุกครั้งที่โหลดหน้า — ไม่มี background timer
    function autoExpireBookings() {
        const stored = localStorage.getItem('coco_bookings');
        if (!stored) return false;
        const bookings = JSON.parse(stored);
        const now = new Date();
        let changed = false;

        bookings.forEach(b => {
            // ข้ามสถานะที่ไม่ควรแตะ
            if (b.status === 'processing' || b.status === 'completed' || b.status === 'cancelled') return;
            if (!b.time) return; // ป้องกัน booking เก่าที่ไม่มี time

            // parse เวลาจาก string เช่น '18:00 น.' → match[1]=18, match[2]=0
            const match = b.time.match(/(\d+):(\d+)/);
            if (!match) return;

            const bookingDate = b.date ? parseThaiDate(b.date) : new Date();
            if (!bookingDate) return;

            // ตั้งเวลาในวัน booking ตาม hour:minute ที่ระบุ
            bookingDate.setHours(parseInt(match[1]), parseInt(match[2]), 0, 0);
            // deadline = เวลานัด + 5 นาที
            const deadline = new Date(bookingDate.getTime() + 5 * 60 * 1000);
            if (now > deadline) {
                b.status = 'cancelled'; // เลยเวลา → ยกเลิกอัตโนมัติ
                changed = true;
            }
        });

        // บันทึกเฉพาะเมื่อมีการเปลี่ยนแปลง
        if (changed) localStorage.setItem('coco_bookings', JSON.stringify(bookings));
        return changed;
    }

    // แปลงวันที่ภาษาไทย เช่น '09/03/2568' → Date object
    // ปีพุทธศักราช (> 2400) จะถูกแปลงเป็น ค.ศ. ก่อน
    function parseThaiDate(dateStr) {
        try {
            const parts = dateStr.match(/(\d+)\/(\d+)\/(\d+)/);
            if (parts) {
                const day = parseInt(parts[1]);
                const month = parseInt(parts[2]) - 1;
                let year = parseInt(parts[3]);
                if (year > 2400) year -= 543;
                return new Date(year, month, day);
            }
        } catch(e) {}
        return new Date();
    }

</script>

</html>
