<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - COCO Mala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fcfcfc; }
        input::placeholder { color: #d1d5db; }
        .btn-login { background-color: #ff8a80; transition: all 0.3s ease; }
        button:disabled { cursor: not-allowed !important; pointer-events: auto !important; }
        .btn-active { background-color: #ED3B2B !important; }
        .btn-error  { background-color: #FC938A !important; }
        .error-text { color: #F46363; font-size: 0.75rem; margin-left: 0.25rem; display: none; }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <nav class="border-b border-gray-200 py-4 px-6 flex justify-between items-center sticky top-0 bg-white z-50">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-200 flex-shrink-0">
                <img src="../Logo-COCO/COCO Mala.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="font-bold text-lg tracking-wide">COCO หม่าล่าทั่ง</span>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-[400px] bg-white rounded-[2.5rem] shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-gray-50 p-10 flex flex-col items-center">
            <h1 class="text-[1.25rem] font-medium text-gray-700 mb-10 text-center">เข้าสู่ระบบสำหรับ Admin</h1>

            <div class="w-full space-y-6">

                <!-- ช่องอีเมล -->
                <div class="space-y-1">
                    <label class="block text-gray-800 text-sm ml-1">อีเมล :</label>
                    <input type="email" id="adminEmail" placeholder="กรอกอีเมล"
                        class="w-full px-5 py-3.5 rounded-2xl border border-gray-200 focus:outline-none focus:ring-1 focus:ring-orange-300 bg-white text-gray-600 transition-all">
                    <span id="emailError" class="error-text">กรุณากรอกอีเมล</span>
                </div>

                <!-- ช่องรหัสผ่าน -->
                <div class="space-y-1">
                    <label class="block text-gray-800 text-sm ml-1">รหัสผ่าน :</label>
                    <div class="relative">
                        <input type="password" id="adminPass" placeholder="กรอกรหัสผ่าน"
                            class="w-full px-5 py-3.5 rounded-2xl border border-gray-200 focus:outline-none focus:ring-1 focus:ring-orange-300 bg-white text-gray-600 transition-all pr-12">
                        <button type="button" onclick="togglePassword()"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                            <i id="eyeIcon" data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <span id="passError" class="error-text">กรุณากรอกรหัสผ่าน</span>
                    <span id="passLengthError" class="error-text">รหัสผ่านต้องมีอย่างน้อย 8 ตัว</span>
                </div>

                <div class="pt-4">
                    <button type="button" id="loginBtn" disabled
                        class="btn-login w-full text-white font-medium py-3.5 rounded-2xl shadow-sm transition-all cursor-not-allowed">
                        เข้าสู่ระบบ
                    </button>
                </div>

                <div class="text-center pt-2">
                    <a href="forgot_Admin.html"
                        class="text-gray-400 text-sm hover:text-gray-600 transition-colors">ลืมรหัสผ่าน?</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center p-6 z-50">
        <div class="bg-white w-full max-w-xs rounded-[2rem] p-8 flex flex-col items-center text-center">
            <h2 class="text-lg font-medium text-gray-800 mb-2">ข้อมูลไม่ถูกต้อง</h2>
            <p class="text-gray-500 text-sm mb-6 leading-relaxed">กรุณาตรวจสอบอีเมลและรหัสผ่านอีกครั้ง</p>
            <button onclick="closeModal()"
                class="w-full bg-[#ED3B2B] hover:bg-[#d32f22] text-white py-3 rounded-xl shadow-sm transition-colors font-medium">ตกลง</button>
        </div>
    </div>

    <script src="admin-data.js"></script>
    <script>
        lucide.createIcons();

        const emailInput = document.getElementById('adminEmail');
        const passInput  = document.getElementById('adminPass');
        const loginBtn   = document.getElementById('loginBtn');
        const eyeIcon    = document.getElementById('eyeIcon');
        const errorModal = document.getElementById('errorModal');
        const emailError = document.getElementById('emailError');
        const passError  = document.getElementById('passError');
        const passLengthError = document.getElementById('passLengthError');

        // สลับแสดง/ซ่อนรหัสผ่าน
        function togglePassword() {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // ตรวจ input แบบ real-time
        // enable ปุ่มเมื่อ: email มี @ และ password >= 8 ตัว
        function validateForm() {
            const email = emailInput.value.trim();
            const pass  = passInput.value;
            loginBtn.classList.remove('btn-error');

            if (email) emailError.style.display = 'none';
            if (pass)  passError.style.display  = 'none';

            // แจ้ง error รหัสสั้นทันทีที่พิมพ์
            if (pass.length > 0 && pass.length < 8) {
                passLengthError.style.display = 'block';
            } else {
                passLengthError.style.display = 'none';
            }

            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            if (emailValid && pass.length >= 8) {
                loginBtn.removeAttribute('disabled');
                loginBtn.classList.remove('btn-login', 'cursor-not-allowed');
                loginBtn.classList.add('btn-active', 'cursor-pointer', 'active:scale-[0.98]');
            } else {
                loginBtn.setAttribute('disabled', 'true');
                loginBtn.classList.add('btn-login', 'cursor-not-allowed');
                loginBtn.classList.remove('btn-active', 'cursor-pointer', 'active:scale-[0.98]');
            }
        }

        emailInput.addEventListener('input', validateForm);
        passInput.addEventListener('input', validateForm);

        // กดปุ่ม Login → เรียก loginAdmin() จาก admin-data.js
        loginBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const pass  = passInput.value;
            let hasEmpty = false;

            if (!email) { emailError.style.display = 'block'; hasEmpty = true; }
            if (!pass)  { passError.style.display  = 'block'; hasEmpty = true; }
            if (hasEmpty) return;

            const result = loginAdmin(email, pass);
            if (result.success) {
                window.location.href = '../Dashboard_Admin/Dashboard.html';
            } else {
                errorModal.classList.remove('hidden');
                loginBtn.classList.remove('btn-active');
                loginBtn.classList.add('btn-error');
            }
        });

        // กด Enter: ปิด Modal ถ้าเปิดอยู่ หรือ submit login
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (!errorModal.classList.contains('hidden')) {
                    closeModal();
                } else {
                    loginBtn.click();
                }
            }
        });

        function closeModal() {
            errorModal.classList.add('hidden');
            emailInput.value = '';
            passInput.value  = '';
            emailError.style.display = 'none';
            passError.style.display  = 'none';
            loginBtn.setAttribute('disabled', 'true');
            loginBtn.classList.remove('btn-error', 'btn-active', 'cursor-pointer', 'active:scale-[0.98]');
            loginBtn.classList.add('btn-login', 'cursor-not-allowed');
            passInput.type = 'password';
            eyeIcon.setAttribute('data-lucide', 'eye');
            lucide.createIcons();
        }
    </script>
</body>

</html>
