<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COCO Mala - รีเซ็ตรหัสผ่าน Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fcfcfc; }
        input::placeholder { color: #d1d5db; }
        .btn-main   { background-color: #ff8a80; transition: all 0.3s ease; }
        .btn-active { background-color: #ED3B2B !important; }
        .btn-error  { background-color: #FC938A !important; }
        .error-text { color: #F46363; font-size: 0.75rem; margin-left: 0.25rem; display: none; }
        button:disabled { cursor: not-allowed !important; pointer-events: auto !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="border-b border-gray-200 py-5 px-8 flex justify-between items-center sticky top-0 bg-white z-50">
        <div class="flex items-center gap-2">
            <div class="w-14 h-14 rounded-full overflow-hidden border border-gray-200 flex-shrink-0">
                <img src="../Logo-COCO/COCO Mala.jpg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="font-bold text-xl tracking-wide">COCO หม่าล่าทั่ง</span>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-6">
    <div class="w-full max-w-[400px] bg-white rounded-[2.5rem] shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-gray-50 p-10 flex flex-col items-center">

        <!-- ── Step 1: กรอกอีเมล ── -->
        <div id="step-email" class="w-full">
            <h1 class="text-[1.25rem] font-medium text-gray-700 mb-2 text-center">รีเซ็ตรหัสผ่าน</h1>
            <p class="text-gray-400 text-sm mb-8 text-center">กรอกอีเมลที่ใช้ลงทะเบียนเพื่อรับรหัส OTP</p>

            <div class="w-full space-y-6">
                <div class="space-y-1">
                    <label class="block text-gray-800 text-sm ml-1">อีเมล :</label>
                    <input type="email" id="resetEmail" placeholder="กรอกอีเมล Admin"
                        class="w-full px-5 py-3.5 rounded-2xl border border-gray-200 focus:outline-none focus:ring-1 focus:ring-orange-300 bg-white text-gray-600 transition-all">
                    <span id="emailError" class="error-text">กรุณากรอกอีเมลให้ถูกต้อง</span>
                </div>

                <div class="flex gap-4 pt-4">
                    <a href="LoginAdmin.html"
                        class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-500 font-medium py-3.5 rounded-2xl transition-all text-center flex items-center justify-center">
                        ยกเลิก
                    </a>
                    <button type="button" id="sendOtpBtn" disabled
                        class="btn-main w-1/2 text-white font-medium py-3.5 rounded-2xl shadow-sm transition-all cursor-not-allowed">
                        ส่ง OTP
                    </button>
                </div>
            </div>
        </div>

        <!-- ── Step 2: กรอก OTP ── -->
        <div id="step-otp" class="w-full hidden">
            <h1 class="text-[1.25rem] font-medium text-gray-700 mb-2 text-center">กรอกรหัส OTP</h1>
            <p class="text-gray-400 text-sm mb-1 text-center">ระบบจำลองการส่ง OTP ไปยังอีเมล</p>
            <!-- แสดง OTP จำลอง (ลบออกเมื่อต่อ email จริง) -->
            <p id="otp-preview" class="text-[#ED3B2B] text-sm font-medium mb-8 text-center"></p>

            <div class="w-full space-y-6">
                <div class="space-y-1">
                    <label class="block text-gray-800 text-sm ml-1">รหัส OTP (6 หลัก) :</label>
                    <input type="text" id="otpInput" placeholder="xxxxxx" maxlength="6"
                        class="w-full px-5 py-3.5 rounded-2xl border border-gray-200 focus:outline-none focus:ring-1 focus:ring-orange-300 bg-white text-gray-600 transition-all tracking-[0.4em] text-center text-lg">
                    <span id="otpError" class="error-text">รหัส OTP ไม่ถูกต้อง</span>
                </div>

                <!-- countdown + ส่งใหม่ -->
                <div class="text-center text-sm text-gray-400">
                    <span id="countdown-text">รหัสหมดอายุใน <span id="countdown" class="text-gray-600 font-medium">5:00</span></span>
                    <button id="resendBtn" onclick="resendOTP()" class="hidden text-[#ED3B2B] hover:underline">ส่ง OTP ใหม่</button>
                </div>

                <div class="flex gap-4 pt-2">
                    <button type="button" onclick="backToEmail()"
                        class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-500 font-medium py-3.5 rounded-2xl transition-all">
                        ย้อนกลับ
                    </button>
                    <button type="button" id="verifyOtpBtn" disabled
                        class="btn-main w-1/2 text-white font-medium py-3.5 rounded-2xl shadow-sm transition-all cursor-not-allowed">
                        ยืนยัน
                    </button>
                </div>
            </div>
        </div>

    </div>
    </div>

    <!-- Error Modal -->
    <div id="errorModal" class="hidden fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center p-6 z-50">
        <div class="bg-white w-full max-w-xs rounded-[2rem] p-8 flex flex-col items-center text-center">
            <h2 class="text-lg font-medium text-gray-800 mb-2">เกิดข้อผิดพลาด</h2>
            <p id="errorMsg" class="text-gray-500 text-sm mb-6 leading-relaxed"></p>
            <button onclick="closeErrorModal()" class="w-full bg-[#ED3B2B] hover:bg-[#d32f22] text-white py-3 rounded-xl shadow-sm transition-colors font-medium">ตกลง</button>
        </div>
    </div>

    <script src="admin-data.js"></script>
    <script>
        const sendOtpBtn   = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const resetEmail   = document.getElementById('resetEmail');
        const otpInput     = document.getElementById('otpInput');
        let countdownTimer = null;

        // ── Step 1: validate อีเมล real-time ──
        resetEmail.addEventListener('input', () => {
            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(resetEmail.value.trim());
            if (emailValid) {
                sendOtpBtn.removeAttribute('disabled');
                sendOtpBtn.classList.remove('btn-main', 'cursor-not-allowed');
                sendOtpBtn.classList.add('btn-active', 'cursor-pointer', 'active:scale-[0.98]');
                document.getElementById('emailError').style.display = 'none';
            } else {
                sendOtpBtn.setAttribute('disabled', 'true');
                sendOtpBtn.classList.add('btn-main', 'cursor-not-allowed');
                sendOtpBtn.classList.remove('btn-active', 'cursor-pointer', 'active:scale-[0.98]');
            }
        });

        // กดส่ง OTP → ตรวจว่า email มีในระบบ
        sendOtpBtn.addEventListener('click', () => {
            const email = resetEmail.value.trim();
            if (!verifyAdminEmail(email)) {
                document.getElementById('emailError').style.display = 'block';
                document.getElementById('emailError').textContent = 'ไม่พบอีเมลนี้ในระบบ';
                return;
            }
            sendOTP(email);
        });

        // สร้าง OTP และแสดง step 2
        function sendOTP(email) {
            const otp = generateOTP(email); // จาก admin-data.js
            // แสดง OTP จำลอง (ลบ 2 บรรทัดนี้เมื่อต่อ email จริง)
            document.getElementById('otp-preview').textContent = `OTP ของคุณ: ${otp}`;
            document.getElementById('step-email').classList.add('hidden');
            document.getElementById('step-otp').classList.remove('hidden');
            startCountdown(5 * 60); // 5 นาที
        }

        function resendOTP() {
            const email = resetEmail.value.trim();
            sendOTP(email);
            document.getElementById('resendBtn').classList.add('hidden');
            document.getElementById('countdown-text').classList.remove('hidden');
        }

        function backToEmail() {
            clearInterval(countdownTimer);
            document.getElementById('step-otp').classList.add('hidden');
            document.getElementById('step-email').classList.remove('hidden');
            otpInput.value = '';
        }

        // ── นับถอยหลัง ──
        function startCountdown(seconds) {
            clearInterval(countdownTimer);
            let remaining = seconds;
            updateCountdownDisplay(remaining);
            countdownTimer = setInterval(() => {
                remaining--;
                updateCountdownDisplay(remaining);
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    // OTP หมดอายุ → ซ่อน countdown แสดงปุ่มส่งใหม่
                    document.getElementById('countdown-text').classList.add('hidden');
                    document.getElementById('resendBtn').classList.remove('hidden');
                }
            }, 1000);
        }

        function updateCountdownDisplay(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(1, '0');
            const s = String(seconds % 60).padStart(2, '0');
            document.getElementById('countdown').textContent = `${m}:${s}`;
        }

        // ── Step 2: validate OTP real-time ──
        otpInput.addEventListener('input', () => {
            // รับเฉพาะตัวเลข
            otpInput.value = otpInput.value.replace(/\D/g, '');
            document.getElementById('otpError').style.display = 'none';
            if (otpInput.value.length === 6) {
                verifyOtpBtn.removeAttribute('disabled');
                verifyOtpBtn.classList.remove('btn-main', 'cursor-not-allowed');
                verifyOtpBtn.classList.add('btn-active', 'cursor-pointer', 'active:scale-[0.98]');
            } else {
                verifyOtpBtn.setAttribute('disabled', 'true');
                verifyOtpBtn.classList.add('btn-main', 'cursor-not-allowed');
                verifyOtpBtn.classList.remove('btn-active', 'cursor-pointer', 'active:scale-[0.98]');
            }
        });

        // กดยืนยัน OTP → เรียก verifyOTP() จาก admin-data.js
        verifyOtpBtn.addEventListener('click', () => {
            const email = resetEmail.value.trim();
            const result = verifyOTP(email, otpInput.value);
            if (result.success) {
                clearInterval(countdownTimer);
                window.location.href = 'Change.html'; // adminVerified='true' ถูกตั้งใน verifyOTP()
            } else {
                document.getElementById('otpError').style.display = 'block';
                document.getElementById('otpError').textContent = result.message;
            }
        });

        function closeErrorModal() {
            document.getElementById('errorModal').classList.add('hidden');
        }
    </script>
</body>
</html>
